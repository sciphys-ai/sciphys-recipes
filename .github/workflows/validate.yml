name: Validate recipes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sciphys_os_ref:
        description: SciPhys OS branch, tag, or commit to test
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/validate.py

  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout SciPhys OS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sciphys-ai/sciphys-os
          ref: ${{ inputs.sciphys_os_ref }}
          path: sciphys-os
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-dev.txt
      - run: corepack enable
      - name: Build SciPhys OS
        working-directory: sciphys-os
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Run ZnO evidence recipe
        run: >-
          python recipes/xrd-zno-evidence/run.py
          --sciphys-os "$GITHUB_WORKSPACE/sciphys-os"
          --output "$RUNNER_TEMP/xrd-zno-output"
      - name: Upload evidence artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xrd-zno-evidence
          path: ${{ runner.temp }}/xrd-zno-output
          if-no-files-found: error
          retention-days: 14
