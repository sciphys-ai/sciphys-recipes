name: Validate recipes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sciphys_os_ref:
        description: SciPhys OS branch, tag, or commit to test
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/validate.py

  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recipes
        uses: actions/checkout@v4
      - name: Checkout SciPhys OS
        uses: actions/checkout@v4
        with:
          repository: sciphys-ai/sciphys-os
          ref: ${{ inputs.sciphys_os_ref }}
          path: sciphys-os
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-dev.txt
      - run: corepack enable
      - name: Build SciPhys OS
        working-directory: sciphys-os
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Run ZnO evidence recipe
        run: >-
          python recipes/xrd-zno-evidence/run.py
          --sciphys-os "$GITHUB_WORKSPACE/sciphys-os"
          --output "$RUNNER_TEMP/xrd-zno-output"
      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xrd-zno-evidence
          path: ${{ runner.temp }}/xrd-zno-output
          if-no-files-found: error
          retention-days: 14
